oiosaml.servlet.keystore.location=keystore.p12
oiosaml.servlet.keystore.password=Test1234
oiosaml.servlet.keystore.alias=java.referenceimplementering

# for use with NemLog-in2
oiosaml.servlet.entityid=https://saml.oiosaml3-demo-app
oiosaml.servlet.baseurl=https://localhost:8443/oiosaml3-demo.java
# IntTest Idp, metadata downloaded from the NemLog-in test portal and placed on the classpath
#oiosaml.servlet.idp.entityid=https://saml.test-nemlog-in.dk/
#oiosaml.servlet.idp.metadata.file=test-nemlog-in-idp-metadata.xml
# DevTest4 Idp
oiosaml.servlet.idp.entityid=https://saml.test-devtest4-nemlog-in.dk
oiosaml.servlet.idp.metadata.file=test-devtest4-idp-metadata.xml

# for use with test IdP
#oiosaml.servlet.entityid=https://saml.oiosaml3-demo-app
#oiosaml.servlet.baseurl=https://localhost:8443/oiosaml3-demo.java
#oiosaml.servlet.idp.entityid=https://localhost:7080
# Fetch https://localhost:7080/saml/metadata once and save it next to this file
#oiosaml.servlet.idp.metadata.file=test-idp-metadata.xml
oiosaml.servlet.revocation.crl.check.enabled=false
oiosaml.servlet.revocation.ocsp.check.enabled=false

# Send OCSP requests using POST instead of the RFC 5019 GET form (default true). The NemLog-in OCSP
# responders answer HTTP 404 to the GET form used by JDK 12+, so only disable this if the responders
# in use handle GET and the JVM wide setting of 'com.sun.security.ocsp.useget' is unwanted.
#oiosaml.servlet.revocation.ocsp.post.enabled=true

# NemLogin-in2 does not return OIOSAML 3 profile valid assertions
oiosaml.servlet.profile.validation.enabled=true

# Allow users without NSIS LoA, but AssuranceLevel 3
oiosaml.servlet.profile.validation.assurancelevel.allowed=true
oiosaml.servlet.profile.validation.assurancelevel.minimum=3

oiosaml.servlet.secondary.page.error=error.jsp
oiosaml.servlet.secondary.page.logout=index.jsp
oiosaml.servlet.secondary.page.login=index.jsp

# Appswitch Return URLs
oiosaml.appswitch.returnurl.android=https://android.return.url
oiosaml.appswitch.returnurl.ios=https://ios.return.url
