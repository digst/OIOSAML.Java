<!DOCTYPE html>
<html>
<head th:fragment="header">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="_csrf" th:content="${_csrf.token}" />

    <title th:text="#{html.global.title}"/>

    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; margin: 0; padding: 16px; }
        .box { max-width: 480px; margin: 15px auto; padding: 16px 24px; border: 5px solid #dee2e6; border-radius: 8px; }
        label { display: block; margin: 12px 0 4px; }
        input { box-sizing: border-box; width: 100%; padding: 8px; font-size: 1rem; }
        button { width: 100%; margin-top: 20px; padding: 12px; font-size: 1.2rem; color: #fff; background-color: #4765a0; border: 0; border-radius: 4px; }
    </style>
</head>
</html>
