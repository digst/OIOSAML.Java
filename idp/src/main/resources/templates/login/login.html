<!DOCTYPE html>
<html>
<head th:replace="fragments/header :: header"/>
<body>
<form class="box" method="post" action="/saml/sso">
    <h2 th:text="#{html.login.title}"></h2>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <label for="username" th:text="#{html.login.label.username}"></label>
    <input type="text" id="username" name="username" th:placeholder="#{html.login.placeholder.username}" required autofocus>

    <label for="password" th:text="#{html.login.label.password}"></label>
    <input type="password" id="password" name="password" th:placeholder="#{html.login.placeholder.password}" required>

    <button id="submitButton" type="submit" th:text="#{html.login.btn}"></button>
</form>
</body>
</html>
